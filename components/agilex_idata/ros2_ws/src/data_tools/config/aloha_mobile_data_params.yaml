/**:
  ros__parameters:
    dataInfo:

      camera:
        color:
          checkFrameRate: 25
          names: ['left', 'front', 'right', 'head']
          parentFrames: ['camera_l_link', 'camera_f_link', 'camera_r_link', 'camera_h_link']
          topics: ['/camera_l/color/image_raw', '/camera_f/color/image_raw', '/camera_r/color/image_raw', '/camera_h/color/image_raw']
          # camera_h is an uncalibrated driver-free USB camera; do not record its placeholder camera_info.
          configTopics: ['/camera_l/color/camera_info', '/camera_f/color/camera_info', '/camera_r/color/camera_info']

      arm:
        jointState:
          checkFrameRate: 180
          names: ['masterLeft', 'masterRight', 'puppetLeft', 'puppetRight']
          topics: ['/master/joint_left', '/master/joint_right', '/puppet/joint_left', '/puppet/joint_right']

      localization:
        pose:
          checkFrameRate: 180
          names: ['puppetLeft', 'puppetRight']
          topics: ['/puppet/end_pose_left', '/puppet/end_pose_right']

      robotBase:
        state:
          checkFrameRate: 5
          names: ['chassis']
          parentFrames: ['map']
          topics: ['/localization/pose']
          toSyncs: [false]
        vel:
          checkFrameRate: 5
          names: ['chassis']
          parentFrames: ['base_link']
          topics: ['/odom']
          toSyncs: [true]
        action:
          checkFrameRate: 5
          names: ['chassis']
          parentFrames: ['base_link']
          topics: ['/action/chassis']
          toSyncs: [true]

      lift:
        motor:
          checkFrameRate: 1
          names: ['column']
          topics: ['/LiftMotorStatePub']
          pubTopics: ['/LiftingMotorService']
          toSyncs: [false]

      action:
        lifting:
          checkFrameRate: 60
          names: ['column']
          topics: ['/action/lifting']
          toSyncs: [false]
