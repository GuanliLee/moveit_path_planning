scene_id: 1
scene_name: dual_piper_with_table_open_trapezoid_box_and_shelf
world_frame: world

robot:
  dual_arm_source: agilex_xpc_dual_piper_rviz
  base_distance: 0.6

table:
  enabled: false
  id: table
  frame_id: world
  type: box

  # The 1.2 m long side follows the Y axis, parallel to the line between the
  # two bases. The 1.0 m width extends along the X axis.
  size_x: 1.0
  size_y: 1.2
  thickness: 0.05

  # The table top is level with the Piper base reference plane.
  # Base midpoint (0, 0) is centered along the near long edge and lies 0.07 m
  # inside it: near edge x = center_x - size_x / 2 = -0.07.
  top_z: 0.0
  center_x: 0.43
  center_y: 0.0

open_trapezoid_box:
  enabled: false
  id: scene_1_open_trapezoid_box
  frame_id: world
  type: open_trapezoid_box

  # Outer dimensions. The long axis follows Y, parallel to the table long edge
  # and to the line between the two Piper bases.
  bottom_length: 0.3
  bottom_width: 0.2
  top_length: 0.4
  top_width: 0.3
  height: 0.2
  thickness: 0.005
  long_axis: y

  # The bottom rests on the tabletop. Its center is 0.29 m from the near table
  # edge at x=-0.07, and therefore 0.22 m from the base midpoint at x=0.
  bottom_z: 0.0
  center_x: 0.22
  center_y: 0.0

shelf:
  enabled: true
  id: scene_1_shelf
  frame_id: world
  type: shelf

  # The long side follows Y, parallel to the table long edge. The four posts
  # define the 0.5 m x 0.265 m outer footprint and the 0.44 m total height.
  length: 0.5
  width: 0.265
  height: 0.42
  long_axis: y

  board_length: 0.5
  board_width: 0.26
  board_thickness: 0.02
  # Keep the lower and middle boards; the top board is intentionally omitted.
  board_center_heights: [0.035, 0.22]
  post_diameter: 0.015

  # The shelf bottom rests on the tabletop. The center is 0.595 m from the near
  # table edge at x=-0.07, so center_x = -0.07 + 0.595 = 0.525.
  bottom_z: 0.0
  center_x: 0.535
  center_y: 0.0

obstacle:
  enabled: true
  id: pillar
  frame_id: world
  type: box

  # The 0.07 m long side follows Y, parallel to the table long edge.
  size_x: 0.03
  size_y: 0.03
  size_z: 0.7
  center_x: -0.085
  center_y: 0.0
  center_z: 0.35

camera_obstacle:
  enabled: true
  id: cam
  frame_id: world
  type: box

  # The 0.07 m long side follows Y, parallel to the table long edge.
  size_x: 0.09
  size_y: 0.09
  size_z: 0.1
  center_x: -0.025
  center_y: 0.0
  center_z: 0.65
